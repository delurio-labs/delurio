# Finishes a release's image that release.yml pushed to GHCR but did not sign: both architectures check the examples,
# then cosign signs the image by its digest. Run by hand with the release's tag. v0.11.0 needed it: its image job pushed
# the image, then stopped at the arm64 check (Docker's "cannot overwrite digest"), before signing. No build provenance
# is attested here: this run did not build the image, and an attestation from it would say it did.
name: image-sign

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose image to check and sign, e.g. v0.11.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: The tag is a release tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image's digest, from its tag
        id: image
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/delurio-labs/delurio:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Docker's containerd image store will not pull the same index digest for a second platform, so each
      # architecture's pull is removed before the next
      - name: Each architecture's image checks the examples
        run: |
          image="ghcr.io/delurio-labs/delurio@${{ steps.image.outputs.digest }}"
          for arch in amd64 arm64; do
            docker run --rm --pull always --platform "linux/$arch" -v "$PWD/examples:/work/examples:ro" "$image" check examples --strict
            docker image rm "$image" >/dev/null
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image by its digest
        run: cosign sign --yes "ghcr.io/delurio-labs/delurio@${{ steps.image.outputs.digest }}"
