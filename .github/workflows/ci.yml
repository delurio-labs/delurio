name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check the examples with the built package
        run: node dist/cli.js check examples --strict
      - name: Write the examples' pages with the built package
        run: node dist/cli.js page examples --out "$RUNNER_TEMP/pages" --strict
      - name: A graph that breaks its schema fails the check
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/broken"
          sed -i 's/left: { type: final, title: The user leaves, leavesPage: true }/left: { type: final, title: The user leaves, and nothing is sent, leavesPage: true }/' "$RUNNER_TEMP/broken/flow.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/broken" --strict > "$RUNNER_TEMP/broken.txt" || code=$?
          cat "$RUNNER_TEMP/broken.txt"
          test "$code" -eq 2
          grep -F '[schema]' "$RUNNER_TEMP/broken.txt"
      - name: Unsupported YAML is refused at once, not read for minutes
        run: |
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const put = (name, text) => { fs.mkdirSync(`${dir}/${name}`, { recursive: true }); fs.writeFileSync(`${dir}/${name}/flow.yaml`, text); };
            let key = "x";
            for (let d = 0; d < 400; d++) key = `{${key}: ${d}}`;
            let keys = "";
            for (let i = 0; keys.length < 40000; i++) keys += `? ${key.replace("x", "x" + i)}\n: v\n`;
            put("map-keys", keys);
            let aliases = `e: &e []\na: &a [${Array(50).fill("*e").join(", ")}]\nu: [`;
            while (aliases.length < 43000) aliases += "*a, ";
            put("aliases", aliases + "x]\n");
            put("tag", "schema: delurio-graph/0\nkind: flow\nid: tagged\ntitle: !custom Tagged\n");
          ' "$RUNNER_TEMP/yaml"
          code=0
          timeout 60 node dist/cli.js check "$RUNNER_TEMP/yaml" > "$RUNNER_TEMP/yaml.txt" || code=$?
          cat "$RUNNER_TEMP/yaml.txt"
          test "$code" -eq 1
          test "$(grep -c 'unsupported YAML.*\[load\]' "$RUNNER_TEMP/yaml.txt")" -eq 3
      - name: A state of a captured flow that names no code fails the check
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/captured"
          sed -i 's/^status: proposed.*/status: captured/' "$RUNNER_TEMP/captured/flow.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/captured" --strict > "$RUNNER_TEMP/captured.txt" || code=$?
          cat "$RUNNER_TEMP/captured.txt"
          test "$code" -eq 2
          grep -F '[source-missing]' "$RUNNER_TEMP/captured.txt"
          ! grep -F 'state left names no code' "$RUNNER_TEMP/captured.txt"
      - name: A server function is no HTTP operation, and its method says whether it writes
        run: |
          cp -r examples/notes "$RUNNER_TEMP/server-fn"
          printf 'actions:\n  restoreNote:\n    route: POST /notes/{id}/restore\n' >> "$RUNNER_TEMP/server-fn/domain/domain.yaml"
          sed -i 's/^    serverFn: GET$/    serverFn: GET\n    query: { type: object }/' "$RUNNER_TEMP/server-fn/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn" --strict > "$RUNNER_TEMP/server-fn.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn.txt"
          test "$code" -eq 2
          test "$(grep -c '\[server-fn-http\]' "$RUNNER_TEMP/server-fn.txt")" -eq 2
          grep -F 'domain.yaml' "$RUNNER_TEMP/server-fn.txt" | grep -F 'note: its route is given here'

          cp -r examples/notes "$RUNNER_TEMP/server-fn-method"
          sed -i 's/^    serverFn: POST$/    serverFn: PUT/' "$RUNNER_TEMP/server-fn-method/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn-method" --strict > "$RUNNER_TEMP/server-fn-method.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn-method.txt"
          test "$code" -eq 2
          grep -F 'serverFn: must be "GET" or "POST" [schema]' "$RUNNER_TEMP/server-fn-method.txt"

          cp -r examples/notes "$RUNNER_TEMP/server-fn-writes"
          sed -i '/^changes:/d' "$RUNNER_TEMP/server-fn-writes/restore/ui.yaml"
          sed -i 's/do: \[archiveNote, restoreNote\]/do: [archiveNote]/' "$RUNNER_TEMP/server-fn-writes/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn-writes" --strict > "$RUNNER_TEMP/server-fn-writes.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn-writes.txt"
          test "$code" -eq 2
          grep -F 'its steps write (restoreNote), but ui.yaml has no changes note' "$RUNNER_TEMP/server-fn-writes.txt"
      - name: The page says how each step's action is called
        run: |
          grep -F 'a server function, POST, called only by the product' "$RUNNER_TEMP/pages/notes/restore/index.html"
          grep -F 'an HTTP operation, POST /notes/{id}/archive' "$RUNNER_TEMP/pages/notes/archive/index.html"
