# The checker is the Rust one (crates/); the npm package (js/) runs it as a native addon. CI holds the Rust code to its
# own tests (the behaviour cases that encode SPEC.md run under cargo test), every pinned dependency to the supply-chain
# rule, and the npm package to the module API delurio's own code imports, as npm installs it on Node 26.13.1. The
# differential harness against the TypeScript checker (tests/differential) is a tool to run by hand, not a gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The toolchain rust-toolchain.toml names
        run: rustup toolchain install
      - name: Formatted
        run: cargo fmt --all --check
      - name: Clippy, warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (the behaviour cases of SPEC.md among them)
        run: cargo test --workspace --locked
      - name: The release binary
        run: cargo build --release --locked -p delurio

  # every crate Cargo.lock pins and every npm package package-lock.json pins was published at least 7 days ago
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - run: node tests/supply-chain/crates-age.mjs
      - run: node tests/supply-chain/npm-age.mjs

  # the npm package as npm installs it: the main package and this platform's addon package, packed, installed into a
  # project of their own, and held to the module API delurio's own code relies on
  npm-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      # npm ci refuses a lockfile that cannot hold the platform packages of the version being built (they are
      # published with it); npm install --no-save installs every other package at the version the lockfile pins
      - run: npm install --no-save --ignore-scripts --omit=optional --no-audit --no-fund
      - name: The addon, built
        run: npm run build
      - name: The module API tests in the checkout
        run: node --test tests/node/
      - name: Packed as it is published
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          cp delurio.linux-x64-gnu.node LICENSE NOTICE npm/linux-x64-gnu/
          npm pack --pack-destination "$RUNNER_TEMP/packs"
          npm pack ./npm/linux-x64-gnu --pack-destination "$RUNNER_TEMP/packs"
          tar -tzf "$RUNNER_TEMP/packs/delurio-cli-0"*.tgz | sort
      - name: Installed into a project, its modules and its bin pass the same tests
        run: |
          app="$RUNNER_TEMP/app"
          mkdir -p "$app" && cd "$app"
          echo '{ "name": "app", "private": true, "type": "module" }' > package.json
          npm install --ignore-scripts --omit=optional --no-audit --no-fund "$RUNNER_TEMP/packs/"delurio-cli-0*.tgz "$RUNNER_TEMP/packs/"delurio-cli-linux-x64-gnu-*.tgz
          cp -r "$GITHUB_WORKSPACE/examples" "$GITHUB_WORKSPACE/tests" .
          node --test tests/node/
          npx delurio --help
          node node_modules/@delurio/cli/js/cli.js check examples --strict
