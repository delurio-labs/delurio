name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check the examples with the built package
        run: node dist/cli.js check examples --strict
      - name: Write the examples' pages with the built package
        run: node dist/cli.js page examples --out "$RUNNER_TEMP/pages" --strict
      - name: A graph that breaks its schema fails the check
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/broken"
          sed -i 's/left: { type: final, title: The user leaves, leavesPage: true }/left: { type: final, title: The user leaves, and nothing is sent, leavesPage: true }/' "$RUNNER_TEMP/broken/flow.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/broken" --strict > "$RUNNER_TEMP/broken.txt" || code=$?
          cat "$RUNNER_TEMP/broken.txt"
          test "$code" -eq 2
          grep -F '[schema]' "$RUNNER_TEMP/broken.txt"
      - name: Unsupported YAML is refused at once, not read for minutes
        run: |
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const put = (name, text) => { fs.mkdirSync(`${dir}/${name}`, { recursive: true }); fs.writeFileSync(`${dir}/${name}/flow.yaml`, text); };
            let key = "x";
            for (let d = 0; d < 400; d++) key = `{${key}: ${d}}`;
            let keys = "";
            for (let i = 0; keys.length < 40000; i++) keys += `? ${key.replace("x", "x" + i)}\n: v\n`;
            put("map-keys", keys);
            let aliases = `e: &e []\na: &a [${Array(50).fill("*e").join(", ")}]\nu: [`;
            while (aliases.length < 43000) aliases += "*a, ";
            put("aliases", aliases + "x]\n");
            put("tag", "schema: delurio-graph/0\nkind: flow\nid: tagged\ntitle: !custom Tagged\n");
          ' "$RUNNER_TEMP/yaml"
          code=0
          timeout 60 node dist/cli.js check "$RUNNER_TEMP/yaml" > "$RUNNER_TEMP/yaml.txt" || code=$?
          cat "$RUNNER_TEMP/yaml.txt"
          test "$code" -eq 1
          test "$(grep -c 'unsupported YAML.*\[load\]' "$RUNNER_TEMP/yaml.txt")" -eq 3
      - name: A state of a captured flow that names no code fails the check
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/captured"
          sed -i 's/^status: proposed.*/status: captured/' "$RUNNER_TEMP/captured/flow.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/captured" --strict > "$RUNNER_TEMP/captured.txt" || code=$?
          cat "$RUNNER_TEMP/captured.txt"
          test "$code" -eq 2
          grep -F '[source-missing]' "$RUNNER_TEMP/captured.txt"
          ! grep -F 'state left names no code' "$RUNNER_TEMP/captured.txt"
      - name: A server function is no HTTP operation, and its method says whether it writes
        run: |
          cp -r examples/notes "$RUNNER_TEMP/server-fn"
          printf 'actions:\n  restoreNote:\n    route: POST /notes/{id}/restore\n' >> "$RUNNER_TEMP/server-fn/domain/domain.yaml"
          sed -i 's/^    serverFn: GET$/    serverFn: GET\n    query: { type: object }/' "$RUNNER_TEMP/server-fn/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn" --strict > "$RUNNER_TEMP/server-fn.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn.txt"
          test "$code" -eq 2
          test "$(grep -c '\[server-fn-http\]' "$RUNNER_TEMP/server-fn.txt")" -eq 2
          grep -F 'domain.yaml' "$RUNNER_TEMP/server-fn.txt" | grep -F 'note: its route is given here'

          cp -r examples/notes "$RUNNER_TEMP/server-fn-method"
          sed -i 's/^    serverFn: POST$/    serverFn: PUT/' "$RUNNER_TEMP/server-fn-method/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn-method" --strict > "$RUNNER_TEMP/server-fn-method.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn-method.txt"
          test "$code" -eq 2
          grep -F 'serverFn: must be "GET" or "POST" [schema]' "$RUNNER_TEMP/server-fn-method.txt"

          cp -r examples/notes "$RUNNER_TEMP/server-fn-writes"
          sed -i '/^changes:/d' "$RUNNER_TEMP/server-fn-writes/restore/ui.yaml"
          sed -i 's/do: \[archiveNote, restoreNote\]/do: [archiveNote]/' "$RUNNER_TEMP/server-fn-writes/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn-writes" --strict > "$RUNNER_TEMP/server-fn-writes.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn-writes.txt"
          test "$code" -eq 2
          grep -F 'its steps write (restoreNote), but ui.yaml has no changes note' "$RUNNER_TEMP/server-fn-writes.txt"
      - name: The page says how each step's action is called
        run: |
          grep -F 'a server function, POST, called only by the product' "$RUNNER_TEMP/pages/notes/restore/index.html"
          grep -F 'an HTTP operation, POST /notes/{id}/archive' "$RUNNER_TEMP/pages/notes/archive/index.html"
      - name: Every folder given is checked, each graph once, and a path that is not a folder is refused
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/second"
          sed -i 's/left: { type: final, title: The user leaves, leavesPage: true }/left: { type: final, title: The user leaves, and nothing is sent, leavesPage: true }/' "$RUNNER_TEMP/second/flow.yaml"
          code=0
          node dist/cli.js check examples/notes "$RUNNER_TEMP/second" --strict > "$RUNNER_TEMP/second.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/second.txt"
          test "$code" -eq 2
          grep -F 'second/flow.yaml' "$RUNNER_TEMP/second.txt" | grep -F '[schema]'
          grep -F 'delurio check: 4 graphs' "$RUNNER_TEMP/second.txt"

          node dist/cli.js check examples examples/notes --strict > "$RUNNER_TEMP/twice.txt" 2>&1
          cat "$RUNNER_TEMP/twice.txt"
          grep -F 'delurio check: 5 graphs, 0 errors' "$RUNNER_TEMP/twice.txt"

          code=0
          node dist/cli.js check examples "$RUNNER_TEMP/nowhere" --strict > "$RUNNER_TEMP/nowhere.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/nowhere.txt"
          test "$code" -eq 1
          grep -F "$RUNNER_TEMP/nowhere is not a folder" "$RUNNER_TEMP/nowhere.txt"
      - name: The focus goes to a node shown where it goes, and a returnsFocus starts at a dialog
        run: |
          cp -r examples/notes "$RUNNER_TEMP/focus"
          sed -i 's/^  saved: savedStatus/  saved: working/' "$RUNNER_TEMP/focus/edit/ui.yaml"
          sed -i 's/returnsFocus: \[discardDialog, cancel\]/returnsFocus: [discardDialog, keep]/' "$RUNNER_TEMP/focus/edit/ui.yaml"
          sed -i 's/^  - { labelledBy: \[page, title\] }$/&\n  - { returnsFocus: [page, title] }/' "$RUNNER_TEMP/focus/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/focus" --strict > "$RUNNER_TEMP/focus.txt" || code=$?
          cat "$RUNNER_TEMP/focus.txt"
          test "$code" -eq 2
          test "$(grep -c '\[focus-not-shown\]' "$RUNNER_TEMP/focus.txt")" -eq 2
          grep -F 'focus.saved gives the focus to working, which saved does not show' "$RUNNER_TEMP/focus.txt"
          grep -F 'returnsFocus gives the focus of discardDialog to keep, but no state discardDialog closes into shows it (editing and left)' "$RUNNER_TEMP/focus.txt"
          grep -F 'returnsFocus starts at page, which is not a dialog' "$RUNNER_TEMP/focus.txt" | grep -F '[returns-focus-not-dialog]'

          cp -r examples/notes "$RUNNER_TEMP/focus-state"
          sed -i 's/^  saved: savedStatus/  savd: savedStatus/' "$RUNNER_TEMP/focus-state/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/focus-state" --strict > "$RUNNER_TEMP/focus-state.txt" || code=$?
          cat "$RUNNER_TEMP/focus-state.txt"
          test "$code" -eq 1
          grep -F 'ui focus names the unknown state savd [load]' "$RUNNER_TEMP/focus-state.txt"
      - name: A value is on a field, checked on a checkable role and script (optional or actions) on a page; checked reads the context
        run: |
          cp -r examples/notes "$RUNNER_TEMP/controls"
          sed -i 's/^    emits: SAVE$/&\n    value: { literal: "" }\n    checked: true/; s/^    text: { key: Edit.title }$/&\n    script: optional/; s/value: { key: Edit.bodyValue,/value: { key: Edit.bodyText,/' "$RUNNER_TEMP/controls/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/controls" --strict > "$RUNNER_TEMP/controls.txt" || code=$?
          cat "$RUNNER_TEMP/controls.txt"
          test "$code" -eq 2
          grep -F 'nodes.save.value: is not allowed here (value is only on a field' "$RUNNER_TEMP/controls.txt"
          grep -F 'nodes.save.checked: is not allowed here (checked is only on a node whose role is checkbox' "$RUNNER_TEMP/controls.txt"
          grep -F 'nodes.title.script: is not allowed here (initialFocus, frame and script are only on a page)' "$RUNNER_TEMP/controls.txt"
          grep -F 'catalog key Edit.bodyText is missing [catalog-key-missing]' "$RUNNER_TEMP/controls.txt"

          cp -r examples/notes "$RUNNER_TEMP/script"
          sed -i 's/^    script: optional # .*$/    script: readable/' "$RUNNER_TEMP/script/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/script" --strict > "$RUNNER_TEMP/script.txt" || code=$?
          cat "$RUNNER_TEMP/script.txt"
          test "$code" -eq 2
          grep -F 'nodes.page.script: must be "optional" or "actions" [schema]' "$RUNNER_TEMP/script.txt"
          ! grep -F 'restore/ui.yaml' "$RUNNER_TEMP/script.txt"

          cp -r examples/notes "$RUNNER_TEMP/checked"
          sed -i 's/^    checked: pinned$/    checked: "pined == true"/' "$RUNNER_TEMP/checked/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/checked" --strict > "$RUNNER_TEMP/checked.txt" || code=$?
          cat "$RUNNER_TEMP/checked.txt"
          test "$code" -eq 1
          grep -F 'ui node pinBox: checked: pined == true names pined, which is not a variable or a guard of the flow [load]' "$RUNNER_TEMP/checked.txt"
      - name: The focus after a step is the first of returnsFocus, initialFocus and focus
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { focusAfter, load } from "./dist/graph.js";

            const edit = load("examples/notes/edit");
            const at = (from, to) => { const f = focusAfter(edit.ui, from, to); return f === null ? null : `${f.by} ${f.node}`; };
            assert.equal(at(null, "editing"), "initialFocus title");
            assert.equal(at("editing", "discarding"), "initialFocus discardTitle");
            assert.equal(at("discarding", "editing"), "returnsFocus cancel");
            assert.equal(at("saving", "saved"), "focus savedStatus");
            assert.equal(at("editing", "saving"), null);
            assert.equal(at("editing", "editing"), null);
          '
      - name: Paths cover every reachable state and every transition, the same in every run
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { load } from "./dist/graph.js";
            import { cover, explore, Model } from "./dist/model.js";

            for (const dir of ["examples/qauth-authorize", "examples/notes/edit", "examples/notes/restore", "examples/notes/archive", "examples/sign-out"]) {
              const m = new Model(load(dir).flow);
              const ex = explore(m);
              for (const [by, want] of [["states", new Set(ex.configs.map((c) => c.state))], ["transitions", ex.taken]]) {
                const c = cover(m, by);
                assert.deepEqual(cover(m, by), c, `${dir} ${by}: the same paths in every run`);
                const passed = new Set(c.paths.flatMap((p) => (by === "states" ? p.states : p.transitions)));
                for (const x of want) assert.ok(passed.has(x), `${dir} ${by}: ${x} is on no path`);
                for (const p of c.paths) assert.match(p.id, /^[0-9a-f]{14}$/);
                assert.deepEqual(c.unreached, [], `${dir} ${by}: everything is reached`);
                console.log(`${dir} ${by}: ${c.paths.length} paths`);
              }
            }
            const m = new Model(load("examples/notes/edit").flow);
            const driven = cover(m, "states", m.initials(), (_, s) => s.event !== "CANCEL");
            assert.deepEqual(driven.unreached, ["discarding", "left"]);
          '
      - name: A control may be disabled by what the context holds (disabledWhen), read as checked is
        run: |
          cp -r examples/notes "$RUNNER_TEMP/disabled-when"
          sed -i 's/^    emits: SAVE$/&\n    disabledWhen: "not pinned"/' "$RUNNER_TEMP/disabled-when/edit/ui.yaml"
          node dist/cli.js check "$RUNNER_TEMP/disabled-when" --strict
          node dist/cli.js page "$RUNNER_TEMP/disabled-when/edit" --out "$RUNNER_TEMP/disabled-when-page"
          grep -F 'disabled when not pinned' "$RUNNER_TEMP/disabled-when-page/index.html"

          sed -i 's/disabledWhen: "not pinned"/disabledWhen: "not pined"/' "$RUNNER_TEMP/disabled-when/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/disabled-when" --strict > "$RUNNER_TEMP/disabled-when.txt" || code=$?
          cat "$RUNNER_TEMP/disabled-when.txt"
          test "$code" -eq 1
          grep -F 'ui node save: disabledWhen: not pined names pined, which is not a variable or a guard of the flow [load]' "$RUNNER_TEMP/disabled-when.txt"
      - name: A dialog that several nodes open gives the focus back to the one pressed (a list, or opener)
        run: |
          for target in opener '[cancel, save]'; do
            rm -rf "$RUNNER_TEMP/openers"
            cp -r examples/notes "$RUNNER_TEMP/openers"
            sed -i "s/returnsFocus: \[discardDialog, cancel\]/returnsFocus: [discardDialog, $target]/" "$RUNNER_TEMP/openers/edit/ui.yaml"
            node dist/cli.js check "$RUNNER_TEMP/openers" --strict
          done

          sed -i 's/returnsFocus: \[discardDialog, \[cancel, save\]\]/returnsFocus: [discardDialog, [cancel, keep]]/' "$RUNNER_TEMP/openers/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/openers" --strict > "$RUNNER_TEMP/openers.txt" || code=$?
          cat "$RUNNER_TEMP/openers.txt"
          test "$code" -eq 2
          grep -F 'returnsFocus gives the focus of discardDialog to keep, but no state discardDialog closes into shows it (editing and left)' "$RUNNER_TEMP/openers.txt" | grep -F '[focus-not-shown]'

          sed -i 's/returnsFocus: \[discardDialog, \[cancel, keep\]\]/returnsFocus: [discardDialog, opener]/; /^    emits: CANCEL$/d' "$RUNNER_TEMP/openers/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/openers" --strict > "$RUNNER_TEMP/openers.txt" || code=$?
          cat "$RUNNER_TEMP/openers.txt"
          test "$code" -eq 2
          grep -F 'returnsFocus gives the focus of discardDialog back to the node that opened it, but no node opens it' "$RUNNER_TEMP/openers.txt" | grep -F '[focus-not-shown]'

          sed -i 's/^  working:$/  opener:/' "$RUNNER_TEMP/openers/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/openers" --strict > "$RUNNER_TEMP/openers.txt" || code=$?
          cat "$RUNNER_TEMP/openers.txt"
          grep -F 'the name "opener" is not allowed' "$RUNNER_TEMP/openers.txt" | grep -F '[schema]'

          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { focusAfter, load } from "./dist/graph.js";

            const edit = load("examples/notes/edit");
            const at = (from, to, pressed) => { const f = focusAfter(edit.ui, from, to, pressed); return f === null ? null : `${f.by} ${f.node}`; };
            const back = (target) => { edit.ui.edges = edit.ui.edges.map((e) => (e.returnsFocus === undefined ? e : { returnsFocus: ["discardDialog", target] })); };
            back("opener");
            assert.equal(at("discarding", "editing", "cancel"), "returnsFocus cancel");
            assert.equal(at("discarding", "editing"), null);
            back(["cancel", "save"]);
            assert.equal(at("discarding", "editing", "save"), "returnsFocus save");
            assert.equal(at("discarding", "editing"), null);
            back(["cancel", "keep"]);
            assert.equal(at("discarding", "editing"), "returnsFocus cancel");
          '
