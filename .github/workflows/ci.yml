name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check the examples with the built package
        run: node dist/cli.js check examples --strict
      - name: Write the examples' pages with the built package
        run: node dist/cli.js page examples --out "$RUNNER_TEMP/pages" --strict
      - name: A graph that breaks its schema fails the check
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/broken"
          sed -i 's/left: { type: final, title: The user leaves, leavesPage: true }/left: { type: final, title: The user leaves, and nothing is sent, leavesPage: true }/' "$RUNNER_TEMP/broken/flow.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/broken" --strict > "$RUNNER_TEMP/broken.txt" || code=$?
          cat "$RUNNER_TEMP/broken.txt"
          test "$code" -eq 2
          grep -F '[schema]' "$RUNNER_TEMP/broken.txt"
      - name: Unsupported YAML is refused at once, not read for minutes
        run: |
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const put = (name, text) => { fs.mkdirSync(`${dir}/${name}`, { recursive: true }); fs.writeFileSync(`${dir}/${name}/flow.yaml`, text); };
            let key = "x";
            for (let d = 0; d < 400; d++) key = `{${key}: ${d}}`;
            let keys = "";
            for (let i = 0; keys.length < 40000; i++) keys += `? ${key.replace("x", "x" + i)}\n: v\n`;
            put("map-keys", keys);
            let aliases = `e: &e []\na: &a [${Array(50).fill("*e").join(", ")}]\nu: [`;
            while (aliases.length < 43000) aliases += "*a, ";
            put("aliases", aliases + "x]\n");
            put("tag", "schema: delurio-graph/0\nkind: flow\nid: tagged\ntitle: !custom Tagged\n");
          ' "$RUNNER_TEMP/yaml"
          code=0
          timeout 60 node dist/cli.js check "$RUNNER_TEMP/yaml" > "$RUNNER_TEMP/yaml.txt" || code=$?
          cat "$RUNNER_TEMP/yaml.txt"
          test "$code" -eq 1
          test "$(grep -c 'unsupported YAML.*\[load\]' "$RUNNER_TEMP/yaml.txt")" -eq 3
      - name: A state of a captured flow that names no code fails the check
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/captured"
          sed -i 's/^status: proposed.*/status: captured/' "$RUNNER_TEMP/captured/flow.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/captured" --strict > "$RUNNER_TEMP/captured.txt" || code=$?
          cat "$RUNNER_TEMP/captured.txt"
          test "$code" -eq 2
          grep -F '[source-missing]' "$RUNNER_TEMP/captured.txt"
          ! grep -F 'state left names no code' "$RUNNER_TEMP/captured.txt"
      - name: A server function is no HTTP operation, and its method says whether it writes
        run: |
          cp -r examples/notes "$RUNNER_TEMP/server-fn"
          printf 'actions:\n  restoreNote:\n    route: POST /notes/{id}/restore\n' >> "$RUNNER_TEMP/server-fn/domain/domain.yaml"
          sed -i 's/^    serverFn: GET$/    serverFn: GET\n    query: { type: object }/' "$RUNNER_TEMP/server-fn/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn" --strict > "$RUNNER_TEMP/server-fn.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn.txt"
          test "$code" -eq 2
          test "$(grep -c '\[server-fn-http\]' "$RUNNER_TEMP/server-fn.txt")" -eq 2
          grep -F 'domain.yaml' "$RUNNER_TEMP/server-fn.txt" | grep -F 'note: its route is given here'

          cp -r examples/notes "$RUNNER_TEMP/server-fn-method"
          sed -i 's/^    serverFn: POST$/    serverFn: PUT/' "$RUNNER_TEMP/server-fn-method/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn-method" --strict > "$RUNNER_TEMP/server-fn-method.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn-method.txt"
          test "$code" -eq 2
          grep -F 'serverFn: must be "GET" or "POST" [schema]' "$RUNNER_TEMP/server-fn-method.txt"

          cp -r examples/notes "$RUNNER_TEMP/server-fn-writes"
          sed -i '/^changes:/d' "$RUNNER_TEMP/server-fn-writes/restore/ui.yaml"
          sed -i 's/do: \[archiveNote, restoreNote\]/do: [archiveNote]/' "$RUNNER_TEMP/server-fn-writes/domain/note.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/server-fn-writes" --strict > "$RUNNER_TEMP/server-fn-writes.txt" || code=$?
          cat "$RUNNER_TEMP/server-fn-writes.txt"
          test "$code" -eq 2
          grep -F 'its steps write (restoreNote), but ui.yaml has no changes note' "$RUNNER_TEMP/server-fn-writes.txt"
      - name: The page says how each step's action is called
        run: |
          grep -F 'a server function, POST, called only by the product' "$RUNNER_TEMP/pages/notes/restore/index.html"
          grep -F 'an HTTP operation, POST /notes/{id}/archive' "$RUNNER_TEMP/pages/notes/archive/index.html"
      - name: Every folder given is checked, each graph once, and a path that is not a folder is refused
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/second"
          sed -i 's/left: { type: final, title: The user leaves, leavesPage: true }/left: { type: final, title: The user leaves, and nothing is sent, leavesPage: true }/' "$RUNNER_TEMP/second/flow.yaml"
          code=0
          node dist/cli.js check examples/notes "$RUNNER_TEMP/second" --strict > "$RUNNER_TEMP/second.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/second.txt"
          test "$code" -eq 2
          grep -F 'second/flow.yaml' "$RUNNER_TEMP/second.txt" | grep -F '[schema]'
          grep -F 'delurio check: 4 graphs' "$RUNNER_TEMP/second.txt"

          node dist/cli.js check examples examples/notes --strict > "$RUNNER_TEMP/twice.txt" 2>&1
          cat "$RUNNER_TEMP/twice.txt"
          grep -F 'delurio check: 5 graphs, 0 errors' "$RUNNER_TEMP/twice.txt"

          code=0
          node dist/cli.js check examples "$RUNNER_TEMP/nowhere" --strict > "$RUNNER_TEMP/nowhere.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/nowhere.txt"
          test "$code" -eq 1
          grep -F "$RUNNER_TEMP/nowhere is not a folder" "$RUNNER_TEMP/nowhere.txt"
      - name: The focus goes to a node shown where it goes, and a returnsFocus starts at a dialog
        run: |
          cp -r examples/notes "$RUNNER_TEMP/focus"
          sed -i 's/^  saved: savedStatus/  saved: working/' "$RUNNER_TEMP/focus/edit/ui.yaml"
          sed -i 's/returnsFocus: \[discardDialog, cancel\]/returnsFocus: [discardDialog, keep]/' "$RUNNER_TEMP/focus/edit/ui.yaml"
          sed -i 's/^  - { labelledBy: \[page, title\] }$/&\n  - { returnsFocus: [page, title] }/' "$RUNNER_TEMP/focus/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/focus" --strict > "$RUNNER_TEMP/focus.txt" || code=$?
          cat "$RUNNER_TEMP/focus.txt"
          test "$code" -eq 2
          test "$(grep -c '\[focus-not-shown\]' "$RUNNER_TEMP/focus.txt")" -eq 2
          grep -F 'focus.saved gives the focus to working, which saved does not show' "$RUNNER_TEMP/focus.txt"
          grep -F 'returnsFocus gives the focus of discardDialog to keep, but no state discardDialog closes into shows it (editing and left)' "$RUNNER_TEMP/focus.txt"
          grep -F 'returnsFocus starts at page, which is not a dialog' "$RUNNER_TEMP/focus.txt" | grep -F '[returns-focus-not-dialog]'

          cp -r examples/notes "$RUNNER_TEMP/focus-state"
          sed -i 's/^  saved: savedStatus/  savd: savedStatus/' "$RUNNER_TEMP/focus-state/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/focus-state" --strict > "$RUNNER_TEMP/focus-state.txt" || code=$?
          cat "$RUNNER_TEMP/focus-state.txt"
          test "$code" -eq 1
          grep -F 'ui focus names the unknown state savd [load]' "$RUNNER_TEMP/focus-state.txt"
      - name: A value is on a field, checked on a checkable role and script (optional or actions) on a page; checked reads the context
        run: |
          cp -r examples/notes "$RUNNER_TEMP/controls"
          sed -i 's/^    emits: SAVE$/&\n    value: { literal: "" }\n    checked: true/; s/^    text: { key: Edit.title }$/&\n    script: optional/; s/value: { key: Edit.bodyValue,/value: { key: Edit.bodyText,/' "$RUNNER_TEMP/controls/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/controls" --strict > "$RUNNER_TEMP/controls.txt" || code=$?
          cat "$RUNNER_TEMP/controls.txt"
          test "$code" -eq 2
          grep -F 'nodes.save.value: is not allowed here (value is only on a field' "$RUNNER_TEMP/controls.txt"
          grep -F 'nodes.save.checked: is not allowed here (checked is only on a node whose role is checkbox' "$RUNNER_TEMP/controls.txt"
          grep -F 'nodes.title.script: is not allowed here (initialFocus, frame and script are only on a page)' "$RUNNER_TEMP/controls.txt"
          grep -F 'catalog key Edit.bodyText is missing [catalog-key-missing]' "$RUNNER_TEMP/controls.txt"

          cp -r examples/notes "$RUNNER_TEMP/script"
          sed -i 's/^    script: optional # .*$/    script: readable/' "$RUNNER_TEMP/script/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/script" --strict > "$RUNNER_TEMP/script.txt" || code=$?
          cat "$RUNNER_TEMP/script.txt"
          test "$code" -eq 2
          grep -F 'nodes.page.script: must be "optional" or "actions" [schema]' "$RUNNER_TEMP/script.txt"
          ! grep -F 'restore/ui.yaml' "$RUNNER_TEMP/script.txt"

          cp -r examples/notes "$RUNNER_TEMP/checked"
          sed -i 's/^    checked: pinned$/    checked: "pined == true"/' "$RUNNER_TEMP/checked/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/checked" --strict > "$RUNNER_TEMP/checked.txt" || code=$?
          cat "$RUNNER_TEMP/checked.txt"
          test "$code" -eq 1
          grep -F 'ui node pinBox: checked: pined == true names pined, which is not a variable or a guard of the flow [load]' "$RUNNER_TEMP/checked.txt"
      - name: The focus after a step is the first of returnsFocus, initialFocus and focus
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { focusAfter, load } from "./dist/graph.js";

            const edit = load("examples/notes/edit");
            const at = (from, to) => { const f = focusAfter(edit.ui, from, to); return f === null ? null : `${f.by} ${f.node}`; };
            assert.equal(at(null, "editing"), "initialFocus title");
            assert.equal(at("editing", "discarding"), "initialFocus discardTitle");
            assert.equal(at("discarding", "editing"), "returnsFocus cancel");
            assert.equal(at("saving", "saved"), "focus savedStatus");
            assert.equal(at("editing", "saving"), null);
            assert.equal(at("editing", "editing"), null);
          '
      - name: Paths cover every reachable state and every transition, the same in every run
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { load } from "./dist/graph.js";
            import { cover, explore, Model } from "./dist/model.js";

            for (const dir of ["examples/qauth-authorize", "examples/notes/edit", "examples/notes/restore", "examples/notes/archive", "examples/sign-out"]) {
              const m = new Model(load(dir).flow);
              const ex = explore(m);
              for (const [by, want] of [["states", new Set(ex.configs.map((c) => c.state))], ["transitions", ex.taken]]) {
                const c = cover(m, by);
                assert.deepEqual(cover(m, by), c, `${dir} ${by}: the same paths in every run`);
                const passed = new Set(c.paths.flatMap((p) => (by === "states" ? p.states : p.transitions)));
                for (const x of want) assert.ok(passed.has(x), `${dir} ${by}: ${x} is on no path`);
                for (const p of c.paths) assert.match(p.id, /^[0-9a-f]{14}$/);
                assert.deepEqual(c.unreached, [], `${dir} ${by}: everything is reached`);
                console.log(`${dir} ${by}: ${c.paths.length} paths`);
              }
            }
            const m = new Model(load("examples/notes/edit").flow);
            const driven = cover(m, "states", m.initials(), (_, s) => s.event !== "CANCEL");
            assert.deepEqual(driven.unreached, ["discarding", "left"]);
          '
      - name: A graph that cannot be loaded is reported at its place, and the other graphs are still checked
        run: |
          mkdir -p "$RUNNER_TEMP/load/no-catalog" "$RUNNER_TEMP/load/no-catalog-file" "$RUNNER_TEMP/load/guard" "$RUNNER_TEMP/load/starter" "$RUNNER_TEMP/load/not-yaml"
          printf 'schema: delurio-graph/0\nkind: flow\nid: example.form\ninitial: form\nstates:\n  form: { on: { SEND: done } }\n  done: { type: final }\n' > "$RUNNER_TEMP/load/no-catalog/flow.yaml"
          printf 'schema: delurio-graph/0\nkind: ui\nid: example.form\nflow: example.form\nnodes:\n  send: { type: action, component: Button, role: button, text: { key: Form.send }, in: [form], emits: SEND }\n' > "$RUNNER_TEMP/load/no-catalog/ui.yaml"
          cp "$RUNNER_TEMP/load/no-catalog/flow.yaml" "$RUNNER_TEMP/load/no-catalog-file/flow.yaml"
          sed 's/^flow: example.form$/&\ncatalog: catalog\/en.json/' "$RUNNER_TEMP/load/no-catalog/ui.yaml" > "$RUNNER_TEMP/load/no-catalog-file/ui.yaml"
          printf 'schema: delurio-graph/0\nkind: flow\nid: example.guard\ncontext: { a: { values: [x, y], initial: any } }\ninitial: s\nstates:\n  s: { on: { GO: { target: done, guard: "a ==" } } }\n  done: { type: final }\n' > "$RUNNER_TEMP/load/guard/flow.yaml"
          printf 'schema: delurio-graph/0\nkind: flow\nid: example.starter\ninitial: s\nstates:\n  s: { on: { GO: { target: done, starts: { flow: example.signOut } } } }\n  done: { type: final }\n' > "$RUNNER_TEMP/load/starter/flow.yaml"
          printf 'schema: delurio-graph/0\nkind: flow\nid: example.notYaml\nstates: [\n' > "$RUNNER_TEMP/load/not-yaml/flow.yaml"
          cp -r examples/sign-out "$RUNNER_TEMP/load/sign-out"
          cp -r examples/qauth-authorize "$RUNNER_TEMP/load/target"
          sed -i 's/      DONE: codeIssued/      DONE: codeIsued/' "$RUNNER_TEMP/load/target/flow.yaml"
          cp -r examples/notes "$RUNNER_TEMP/load/notes"
          printf 'oops: [\n' >> "$RUNNER_TEMP/load/notes/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/load" > "$RUNNER_TEMP/load.txt" 2> "$RUNNER_TEMP/load.err" || code=$?
          cat "$RUNNER_TEMP/load.txt" "$RUNNER_TEMP/load.err"
          test "$code" -eq 1
          grep -F 'delurio check: 10 graphs' "$RUNNER_TEMP/load.err"
          ! grep -E 'ERR_INVALID_ARG_TYPE|ENOENT|    at ' "$RUNNER_TEMP/load.err"
          grep -F 'no-catalog/ui.yaml:1:1: error: ui.yaml names no catalog' "$RUNNER_TEMP/load.txt" | grep -F '[load]'
          grep -F 'no-catalog-file/ui.yaml:5:1: error: the catalog catalog/en.json that ui.yaml names does not exist [load]' "$RUNNER_TEMP/load.txt"
          grep -F 'guard/flow.yaml:7:14: error: unexpected end in: a == [load]' "$RUNNER_TEMP/load.txt"
          grep -F 'target/flow.yaml:129:7: error: state issuing goes to codeIsued, which does not exist [load]' "$RUNNER_TEMP/load.txt"
          grep -E 'notes/edit/ui\.yaml:[0-9]+:1: error: .*\[load\]' "$RUNNER_TEMP/load.txt"
          ! grep -F 'notes/edit/flow.yaml' "$RUNNER_TEMP/load.txt"
          ! grep -F 'starter/flow.yaml' "$RUNNER_TEMP/load.txt"
          node dist/cli.js check "$RUNNER_TEMP/load" --format sarif --output "$RUNNER_TEMP/load.sarif" > /dev/null 2>&1 || true
          node -e '
            const run = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).runs[0];
            const at = run.results.filter((r) => r.ruleId === "load").map((r) => `${r.locations[0].physicalLocation.artifactLocation.uri.split("/load/")[1]}:${r.locations[0].physicalLocation.region.startLine}`);
            for (const want of ["no-catalog/ui.yaml:1", "no-catalog-file/ui.yaml:5", "guard/flow.yaml:7", "target/flow.yaml:129"]) if (!at.includes(want)) throw new Error(`no load result at ${want}: ${at.join(", ")}`);
          ' "$RUNNER_TEMP/load.sarif"
      - name: Under --baseline, a known error that keeps a graph from loading is still an error
        run: |
          mkdir -p "$RUNNER_TEMP/known/no-catalog-file"
          printf 'schema: delurio-graph/0\nkind: flow\nid: example.form\ninitial: form\nstates:\n  form: { on: { SEND: done } }\n  done: { type: final }\n' > "$RUNNER_TEMP/known/no-catalog-file/flow.yaml"
          printf 'schema: delurio-graph/0\nkind: ui\nid: example.form\nflow: example.form\ncatalog: catalog/en.json\nnodes:\n  send: { type: action, component: Button, role: button, text: { key: Form.send }, in: [form], emits: SEND }\n' > "$RUNNER_TEMP/known/no-catalog-file/ui.yaml"
          cp -r examples/qauth-authorize "$RUNNER_TEMP/known/schema"
          sed -i 's/left: { type: final, title: The user leaves, leavesPage: true }/left: { type: final, title: The user leaves, and nothing is sent, leavesPage: true }/' "$RUNNER_TEMP/known/schema/flow.yaml"
          node dist/cli.js check "$RUNNER_TEMP/known" --format sarif --output "$RUNNER_TEMP/known.sarif" > /dev/null 2>&1 || true
          code=0
          node dist/cli.js check "$RUNNER_TEMP/known" --strict --baseline "$RUNNER_TEMP/known.sarif" > "$RUNNER_TEMP/known.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/known.txt"
          test "$code" -eq 1
          grep -F 'no-catalog-file/ui.yaml:5:1: error: the catalog catalog/en.json that ui.yaml names does not exist [load]' "$RUNNER_TEMP/known.txt"
          ! grep -F 'warning: the catalog' "$RUNNER_TEMP/known.txt"
          grep -F 'schema/flow.yaml' "$RUNNER_TEMP/known.txt" | grep -F 'warning:' | grep -F '[schema]'
          grep -E 'delurio check: 2 graphs, 1 error, [1-9][0-9]* warnings?; exit 1' "$RUNNER_TEMP/known.txt"
      - name: A state no situation reaches, or one that is no exit and has no way out, fails the check
        run: |
          mkdir -p "$RUNNER_TEMP/reach"
          printf 'schema: delurio-graph/0\nkind: flow\nid: example.checkout\nstatus: proposed\ntitle: Check out\ninitial: cart\nstates:\n  cart: { by: human, on: { CONTINUE: done } }\n  pay: { by: human }\n  done: { type: final }\n' > "$RUNNER_TEMP/reach/flow.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/reach" --strict > "$RUNNER_TEMP/reach.txt" || code=$?
          cat "$RUNNER_TEMP/reach.txt"
          test "$code" -eq 2
          grep -F 'reach/flow.yaml:9:3: error: state pay is not an exit and has no way out' "$RUNNER_TEMP/reach.txt" | grep -F '[state-no-way-out]'
          grep -F 'reach/flow.yaml:9:3: error: state pay is reached by no situation the flow starts in: no transition leads to it' "$RUNNER_TEMP/reach.txt" | grep -F '[state-unreachable]'
          node dist/cli.js check "$RUNNER_TEMP/reach"

          cp -r examples/notes "$RUNNER_TEMP/guarded"
          sed -i 's/^      CANCEL: discarding$/      CANCEL: { target: discarding, guard: "pinned and not pinned" }/' "$RUNNER_TEMP/guarded/edit/flow.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/guarded" --strict > "$RUNNER_TEMP/guarded.txt" || code=$?
          cat "$RUNNER_TEMP/guarded.txt"
          test "$code" -eq 2
          test "$(grep -c '\[state-unreachable\]' "$RUNNER_TEMP/guarded.txt")" -eq 2
          grep -F 'state discarding is reached by no situation the flow starts in: the transitions that lead to it are never taken' "$RUNNER_TEMP/guarded.txt"
          ! grep -F '[state-no-way-out]' "$RUNNER_TEMP/guarded.txt"
      - name: Every locale's catalog has the keys the screens use
        run: |
          cp -r examples/notes "$RUNNER_TEMP/locales"
          sed -i 's/^locales: \[en\]$/locales: [en, tr, de]/' "$RUNNER_TEMP/locales/edit/ui.yaml"
      - name: A control may be disabled by what the context holds (disabledWhen), read as checked is
        run: |
          cp -r examples/notes "$RUNNER_TEMP/disabled-when"
          sed -i 's/^    emits: SAVE$/&\n    disabledWhen: "not pinned"/' "$RUNNER_TEMP/disabled-when/edit/ui.yaml"
          node dist/cli.js check "$RUNNER_TEMP/disabled-when" --strict
          node dist/cli.js page "$RUNNER_TEMP/disabled-when/edit" --out "$RUNNER_TEMP/disabled-when-page" --kit none
          grep -F 'disabled when not pinned' "$RUNNER_TEMP/disabled-when-page/index.html"

          sed -i 's/disabledWhen: "not pinned"/disabledWhen: "not pined"/' "$RUNNER_TEMP/disabled-when/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/disabled-when" --strict > "$RUNNER_TEMP/disabled-when.txt" || code=$?
          cat "$RUNNER_TEMP/disabled-when.txt"
          test "$code" -eq 1
          grep -F 'ui node save: disabledWhen: not pined names pined, which is not a variable or a guard of the flow [load]' "$RUNNER_TEMP/disabled-when.txt"
      - name: A dialog that several nodes open gives the focus back to the one pressed (a list, or opener)
        run: |
          for target in opener '[cancel, save]'; do
            rm -rf "$RUNNER_TEMP/openers"
            cp -r examples/notes "$RUNNER_TEMP/openers"
            sed -i "s/returnsFocus: \[discardDialog, cancel\]/returnsFocus: [discardDialog, $target]/" "$RUNNER_TEMP/openers/edit/ui.yaml"
            node dist/cli.js check "$RUNNER_TEMP/openers" --strict
          done

          sed -i 's/returnsFocus: \[discardDialog, \[cancel, save\]\]/returnsFocus: [discardDialog, [cancel, keep]]/' "$RUNNER_TEMP/openers/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/openers" --strict > "$RUNNER_TEMP/openers.txt" || code=$?
          cat "$RUNNER_TEMP/openers.txt"
          test "$code" -eq 2
          grep -F 'returnsFocus gives the focus of discardDialog to keep, but no state discardDialog closes into shows it (editing and left)' "$RUNNER_TEMP/openers.txt" | grep -F '[focus-not-shown]'

          sed -i 's/returnsFocus: \[discardDialog, \[cancel, keep\]\]/returnsFocus: [discardDialog, opener]/; /^    emits: CANCEL$/d' "$RUNNER_TEMP/openers/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/openers" --strict > "$RUNNER_TEMP/openers.txt" || code=$?
          cat "$RUNNER_TEMP/openers.txt"
          test "$code" -eq 2
          grep -F 'returnsFocus gives the focus of discardDialog back to the node that opened it, but no node opens it' "$RUNNER_TEMP/openers.txt" | grep -F '[focus-not-shown]'

          sed -i 's/^  working:$/  opener:/' "$RUNNER_TEMP/openers/edit/ui.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/openers" --strict > "$RUNNER_TEMP/openers.txt" || code=$?
          cat "$RUNNER_TEMP/openers.txt"
          grep -F 'the name "opener" is not allowed' "$RUNNER_TEMP/openers.txt" | grep -F '[schema]'

          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { focusAfter, load } from "./dist/graph.js";

            const edit = load("examples/notes/edit");
            const at = (from, to, pressed) => { const f = focusAfter(edit.ui, from, to, pressed); return f === null ? null : `${f.by} ${f.node}`; };
            const back = (target) => { edit.ui.edges = edit.ui.edges.map((e) => (e.returnsFocus === undefined ? e : { returnsFocus: ["discardDialog", target] })); };
            back("opener");
            assert.equal(at("discarding", "editing", "cancel"), "returnsFocus cancel");
            assert.equal(at("discarding", "editing"), null);
            back(["cancel", "save"]);
            assert.equal(at("discarding", "editing", "save"), "returnsFocus save");
            assert.equal(at("discarding", "editing"), null);
            back(["cancel", "keep"]);
            assert.equal(at("discarding", "editing"), "returnsFocus cancel");
          '
      - name: A checkbox, a radio and a select are components of their own, named by their label
        run: |
          cp -r examples/notes "$RUNNER_TEMP/controls-drawn"
          python3 - "$RUNNER_TEMP/controls-drawn/edit" <<'PY'
          import json, sys
          d = sys.argv[1]
          ui = open(f"{d}/ui.yaml").read()
          ui = ui.replace("  pinBox:\n    type: field\n    component: ListItem\n", "  pinBox:\n    type: field\n    component: Checkbox\n")
          ui = ui.replace("  save:\n    type: action\n", "  colour:\n    type: field\n    component: Select\n    role: combobox\n    text: { key: Edit.colour }\n    value: { key: Edit.yellow }\n    in: [editing, saving]\n  late:\n    type: field\n    component: Radio\n    role: radio\n    text: { key: Edit.later }\n    checked: true\n    in: [editing]\n  save:\n    type: action\n")
          open(f"{d}/ui.yaml", "w").write(ui)
          words = json.load(open(f"{d}/catalog/en.json"))
          words.update({"Edit.colour": "Colour", "Edit.yellow": "Yellow", "Edit.later": "Remind me later"})
          json.dump(words, open(f"{d}/catalog/en.json", "w"), indent=2)
          PY
          node dist/cli.js check "$RUNNER_TEMP/controls-drawn" --strict
          node dist/cli.js page "$RUNNER_TEMP/controls-drawn/edit" --out "$RUNNER_TEMP/controls-drawn-page" --kit none --strict
          page="$RUNNER_TEMP/controls-drawn-page/index.html"
          grep -F '<input type="checkbox" tabindex="-1"><span>Pin it to the top of my notes</span>' "$page"
          grep -F '<input type="radio" tabindex="-1" checked><span>Remind me later</span>' "$page"
          grep -F '<select class="wf-input" tabindex="-1"><option>Yellow</option></select>' "$page"
          grep -F 'checkbox &quot;Pin it to the top of my notes&quot;' "$page"
          grep -F 'combobox &quot;Colour&quot;' "$page"
      - name: A flow's name for its users (task) is in every locale's catalog
        run: |
          cp -r examples/notes "$RUNNER_TEMP/task"
          sed -i 's/^changes: { key: Changes.note }$/&\ntask: { key: Edit.task }/; s/^locales: \[en\]$/locales: [en, tr]/' "$RUNNER_TEMP/task/edit/ui.yaml"
          node -e '
            const fs = require("fs");
            const dir = process.argv[1];
            const words = JSON.parse(fs.readFileSync(`${dir}/en.json`, "utf8"));
            delete words["Edit.save"];
            fs.writeFileSync(`${dir}/tr.json`, JSON.stringify(words, null, 2));
          ' "$RUNNER_TEMP/locales/edit/catalog"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/locales" --strict > "$RUNNER_TEMP/locales.txt" || code=$?
          cat "$RUNNER_TEMP/locales.txt"
          test "$code" -eq 2
          grep -F 'error: catalog key Edit.save is missing from the tr catalog, catalog/tr.json [catalog-key-missing]' "$RUNNER_TEMP/locales.txt"
          grep -F 'error: the de catalog, catalog/de.json, does not exist' "$RUNNER_TEMP/locales.txt" | grep -F '[catalog-key-missing]'
          test "$(grep -c '\[catalog-key-missing\]' "$RUNNER_TEMP/locales.txt")" -eq 2
      - name: What a flow invokes is held to its domain, as warnings
        run: |
          cp -r examples/qauth-authorize "$RUNNER_TEMP/invokes"
          sed -i 's/invoke: { action: issue }/invoke: { action: issueCode }/; s/    unsafe: \[CSRF_MISMATCH, REQUEST_EXPIRED\]/    unsafe: [CSRF_MISMATCH, REQUEST_EXPIRED, TOKEN_REUSED]/' "$RUNNER_TEMP/invokes/flow.yaml"
          node dist/cli.js check "$RUNNER_TEMP/invokes" --strict > "$RUNNER_TEMP/invokes.txt" 2>&1
          cat "$RUNNER_TEMP/invokes.txt"
          grep -F 'warning: state issuing invokes issueCode, which is not an action of the domain qauth.authorize' "$RUNNER_TEMP/invokes.txt" | grep -F '[invoke-unknown]'
          grep -F 'warning: FAIL.unsafe of deciding stands for TOKEN_REUSED, which is not a refusal of decide' "$RUNNER_TEMP/invokes.txt" | grep -F '[refusal-unknown]'
          grep -F 'delurio check: 1 graph, 0 errors, 2 warnings; exit 0' "$RUNNER_TEMP/invokes.txt"
      - name: A tutorial that no longer matches its flow fails the check at its step
        run: |
          t=edit/tutorial.yaml
          broken() { rm -rf "$RUNNER_TEMP/tutorial"; cp -r examples/notes "$RUNNER_TEMP/tutorial"; sed -i "$2" "$RUNNER_TEMP/tutorial/$1"; code=0; node dist/cli.js check "$RUNNER_TEMP/tutorial" --strict > "$RUNNER_TEMP/tutorial.txt" || code=$?; cat "$RUNNER_TEMP/tutorial.txt"; test "$code" -eq 2; grep -F "$3" "$RUNNER_TEMP/tutorial.txt" | grep -F '[tutorial-mismatch]'; }
          broken $t 's/    press: save/    press: submit/' 'tutorial.yaml:28:5: error: step 4: press submit, which is not a node of ui.yaml'
          broken $t 's/after: \[DONE\]/after: [FINISHED]/' 'step 5: after FINISHED, which no state of example.editNote handles'
          broken $t 's/{pinBox}/{pinButton}/' 'step 3: {pinButton} is neither a sample value nor a node of ui.yaml'
          broken $t 's/scenario: { pinned: false }/scenario: { pinned: maybe }/' 'scenario: "maybe" is not a value of pinned'
          broken $t 's/  - show: saving/  - show: editing/' 'step 5: shows editing, and the flow is in saving here'
          broken edit/ui.yaml 's/^    disabledIn: \[saving\]$/    disabledIn: [editing, saving]/' 'step 4: press save, which is disabled in editing'
          broken edit/flow.yaml 's/^      DONE: saved$/      DONE: editing/' 'step 6: the tutorial ends in saved, and the flow is in editing here'

          cp -r examples/sign-out "$RUNNER_TEMP/diagram"
          printf 'schema: delurio-graph/0\nkind: tutorial\nid: example.signOut.tutorial\nflow: example.signOut\ntitle: Signing out\nstage: diagram\nscenario: { token: valid, hasCookie: true }\nsteps:\n  - show: checking\n    say: "The app sends the token it holds."\n  - end: signed_out.cookie_cleared\n    say: "The session ends, and the cookie with it."\n' > "$RUNNER_TEMP/diagram/tutorial.yaml"
          node dist/cli.js check "$RUNNER_TEMP/diagram" --strict
          sed -i 's/  - end: signed_out.cookie_cleared/  - end: signed_out/' "$RUNNER_TEMP/diagram/tutorial.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/diagram" --strict > "$RUNNER_TEMP/diagram.txt" || code=$?
          cat "$RUNNER_TEMP/diagram.txt"
          test "$code" -eq 2
          grep -F 'step 2: signed_out is not reached from checking without an event (the way stops in signed_out.cookie_cleared) [tutorial-mismatch]' "$RUNNER_TEMP/diagram.txt"
      - name: The example kit draws the notes screens, and a kit that is not data is refused
        run: |
          page="$RUNNER_TEMP/pages/notes/edit/index.html"
          grep -F '<div class="wf kit"' "$page"
          grep -F '<button type="button" class="k-button k-primary">Save</button>' "$page"
          grep -F '<li class="k-item" data-node="pinBox"><label class="k-check"><input type="checkbox"' "$page"
          grep -F -- '--color-accent: #2a54d5;' "$page"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { loadKit } from "./dist/kit.js";
            const kit = loadKit("examples/notes/kit");
            for (const c of ["Heading", "Text", "Button", "LinkButton", "TextField", "Checkbox", "Radio", "Select", "List", "ListItem", "Status", "Alert"]) assert.ok(kit.components[c] !== undefined, `no template for ${c}`);
            assert.deepEqual(kit.dark.map(([n]) => n).filter((n) => !kit.light.some(([m]) => m === n)), []);
          '

          cp -r examples/notes "$RUNNER_TEMP/kit-script"
          sed -i "s|    template: '<p class=\"k-text\">{text}</p>'|    template: '<p class=\"k-text\" onclick=\"go()\">{text}</p>'|" "$RUNNER_TEMP/kit-script/kit/kit.yaml"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/kit-script" --strict > "$RUNNER_TEMP/kit-script.txt" || code=$?
          cat "$RUNNER_TEMP/kit-script.txt"
          test "$code" -eq 1
          grep -F 'event handlers are not allowed: a kit is data, never code [load]' "$RUNNER_TEMP/kit-script.txt"
            words["Edit.task"] = "Edit a note";
            fs.writeFileSync(`${dir}/en.json`, JSON.stringify(words, null, 2));
            fs.writeFileSync(`${dir}/tr.json`, JSON.stringify({ ...words, "Edit.task": "Notu düzenle" }, null, 2));
          ' "$RUNNER_TEMP/task/edit/catalog"
          node dist/cli.js check "$RUNNER_TEMP/task" --strict
          node -e '
            const fs = require("fs");
            const file = `${process.argv[1]}/tr.json`;
            const words = JSON.parse(fs.readFileSync(file, "utf8"));
            delete words["Edit.task"];
            fs.writeFileSync(file, JSON.stringify(words, null, 2));
          ' "$RUNNER_TEMP/task/edit/catalog"
          code=0
          node dist/cli.js check "$RUNNER_TEMP/task" --strict > "$RUNNER_TEMP/task.txt" || code=$?
          cat "$RUNNER_TEMP/task.txt"
          test "$code" -eq 2
          grep -E "edit/ui\.yaml:[0-9]+:1: error: the flow's name for its users, Edit\.task, is not in the tr catalog \(SPEC\.md §4\) \[task-locale\]" "$RUNNER_TEMP/task.txt"
