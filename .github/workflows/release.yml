# A tag vX.Y.Z releases that version twice from one build. To npm it is staged with provenance (trusted publishing, no
# token): it goes live only when a maintainer approves it on npmjs.com, with 2FA. As a container image it goes to GHCR,
# signed with cosign and attested.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing (11.15.0 or later)
        run: npm install -g npm@11.21.0
      - run: npm ci
      - name: The tag is the package's version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm run build
      - run: node dist/cli.js check examples --strict
      - name: Stage it on npm; a maintainer approves it there, with 2FA
        run: npm stage publish --access public

  image:
    needs: npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/delurio-labs/delurio:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/delurio-labs/delurio
            org.opencontainers.image.licenses=Apache-2.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by its digest
        run: cosign sign --yes "ghcr.io/delurio-labs/delurio@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/delurio-labs/delurio
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
