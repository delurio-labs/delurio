# The page of an archived note. Restore sends RESTORE; the page then calls the server function restoreNote. The page is
# drawn on the server, so it reads without JavaScript, but Restore needs it (script: actions).
schema: delurio-graph/0
kind: ui
id: example.restoreNote
flow: example.restoreNote
status: proposed
catalog: catalog/en.json
kit: ../kit # its screens are drawn with the example kit (../kit/kit.yaml)
locales: [en]
changes: { key: Changes.note }

nodes:
  page:
    type: page
    component: Page
    role: main
    name: { labelledBy: title }
    in: [archived, restoring]
    initialFocus: title
    script: actions
  title:
    type: text
    component: Heading
    role: heading
    text: { key: Note.archived }
    in: [archived, restoring]
  restore:
    type: action
    component: Button
    role: button
    intent: confirm
    text: { key: Note.restore }
    name: { key: Note.restore }
    in: [archived, restoring]
    disabledIn: [restoring]
    emits: RESTORE
  working:
    type: status
    component: Status
    role: status
    text: { key: Note.restoring }
    in: [restoring]
  keptFor: # planned: the second phase erases archived notes, and this says when (needs.yaml, says-when-it-is-erased)
    type: text
    component: Text
    text: { key: Note.keptFor }
    in: [archived]

edges:
  - { labelledBy: [page, title] }
  - { triggers: [restore, restoring] }
