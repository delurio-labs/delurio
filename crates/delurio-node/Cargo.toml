[package]
name = "delurio-node"
description = "The Node bindings of @delurio/cli: the checker's modules and the whole command line, as a native addon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# the addon is tested from Node (tests/node/): a test binary of it would need the symbols only Node gives
test = false
doctest = false
bench = false

[dependencies]
delurio = { path = "../delurio" }
delurio-core = { path = "../delurio-core" }
delurio-page = { path = "../delurio-page" }
indexmap = "2.14.2"
napi = { version = "=3.16.1", default-features = false, features = ["napi9"] }
napi-derive = { version = "=3.7.0", default-features = false, features = ["type-def"] }
serde = "1.0.229"
# the values the addon hands JavaScript, written as JSON (the version napi-rs itself locks)
serde_json = "1.0.154"


[build-dependencies]
napi-build = "=2.6.0"
