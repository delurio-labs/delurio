[package]
name = "delurio"
description = "The open checker and page of delurio-graph/0: check every graph in a project's own CI, offline, with GNU error lines and SARIF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["statechart", "graph", "spec", "checker", "sarif"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "delurio"
path = "src/main.rs"

[dependencies]
delurio-core = { path = "../delurio-core" }
delurio-page = { path = "../delurio-page" }
