[package]
name = "delurio-page"
description = "The page of delurio-graph/0: a flow's diagram, its screens and its story, and the pages of a navigation graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
delurio-core = { path = "../delurio-core" }
indexmap = "2.14.2"
regex = "1.13.1"
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "disable-assertions"] }
