</g>
<g class="elabel" data-from="discarding" data-to="editing"><rect x="182.2" y="138" width="114" height="23" rx="4"/>
<text x="189.2" y="155">“Keep editing”</text>
</g>
<circle class="start" cx="339.2" cy="154" r="7"><title>start</title></circle>
