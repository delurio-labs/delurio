<g class="elabel" data-from="editing" data-to="saving"><rect x="112.2" y="331" width="57" height="23" rx="4"/>
<text x="119.2" y="348">“Save”</text>
</g>
<g class="elabel" data-from="editing" data-to="discarding"><rect x="51.7" y="138" width="71" height="23" rx="4"/>
