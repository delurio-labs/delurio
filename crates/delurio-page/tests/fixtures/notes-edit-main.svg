<marker id="arrow-main-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow arrow-main" d="M0 0 L10 5 L0 10 z"/></marker>
