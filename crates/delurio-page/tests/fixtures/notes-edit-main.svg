<path class="edge edge-system" d="M339.2 161 L339.2 183 L221.7 183 L221.7 217" marker-end="url(#arrow-main-system)"/>
<path class="edge edge-user" data-from="editing" data-to="saving" d="M175.2 275 L175.2 410" marker-end="url(#arrow-main-user)"/>
<path class="edge edge-user" data-from="editing" data-to="discarding" d="M128.7 217 L128.7 82" marker-end="url(#arrow-main-user)"/>
